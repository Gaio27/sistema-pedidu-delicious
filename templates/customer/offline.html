{% extends 'base/base.html' %}
{% block title %}Offline - {{ current_restaurant.name }}{% endblock %}

{% block content %}
<div class="container py-5 text-center" style="max-width: 500px;">
  <div class="card card-custom p-4 shadow-sm">
    <i class="fa-solid fa-wifi-slash fa-4x text-warning mb-3"></i>
    <h4 class="fw-bold mb-2" data-i18n="offline_title">Konesaun Internet Kotu</h4>
    <p class="text-muted small mb-4" data-i18n="offline_desc">
      Ita-boot nia devaisu agora offline. Favór verifika rede Wi-Fi ka data, no karga fali pajina.
    </p>
    <button class="btn btn-primary rounded-pill py-2 fw-bold" onclick="window.location.reload()" data-i18n="offline_btn">
      <i class="fa-solid fa-rotate-right me-1"></i> Koko Karga Fali
    </button>
  </div>
</div>
{% endblock %}
